screen = [SHADOWS] [LIGHTING] <empty> [PERFORMANCE]
screen.SHADOWS = [SHADOW_QUALITY] [SHADOW_SOFTNESS]
screen.PERFORMANCE = [WAVING_LEAVES] [RAIN_PUDDLES] <profile>
sliders = SHADOW_QUALITY SUN_PATH_ROTATION
