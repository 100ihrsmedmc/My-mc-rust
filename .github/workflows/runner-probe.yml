name: runner-probe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Report runner
        run: |
          uname -a
          echo "label=${{ matrix.os }} arch=$(uname -m)"
