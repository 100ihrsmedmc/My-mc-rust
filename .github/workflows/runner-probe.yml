name: runner-probe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Report runner
        run: |
          uname -a
          echo "label=${{ matrix.os }} arch=$(uname -m)"
